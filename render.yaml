version: 3

services:
  # Main API Service
  - type: web
    name: payroll-engine-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod

    # Pre-deploy command to run database migrations
    preDeployCommand: npx prisma migrate deploy --config prisma.config.ts

    # Environment variables
    envVars:
      # Application config (hardcoded values)
      - key: NODE_ENV
        value: production

      - key: PORT
        value: '3000'

      # Secrets from GitHub Secrets (sync: true = pull from GitHub Secrets)
      - key: JWT_SECRET
        sync: true

      - key: DB_HOST
        sync: true

      - key: DB_PORT
        sync: true

      - key: DB_USERNAME
        sync: true

      - key: DB_PASSWORD
        sync: true

      - key: DB_NAME
        sync: true
