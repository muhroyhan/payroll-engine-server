name: DB — Seed Only (Manual)

# ─── Trigger ─────────────────────────────────────────────────────────────────
# Manual only — seed should never run automatically to protect production data.
# DB migrations are handled automatically inside the main CI/CD pipeline.
on:
  workflow_dispatch:

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:
  seed:
    name: Seed Database → Supabase
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Full install needed for tsx + tsconfig-paths (@src/* aliases in seed.ts)
      - name: Install dependencies
        run: bun install

      - name: Seed database
        run: bun run seed

      - name: Write seed summary
        run: |
          echo "## DB Seed Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Host** | \`${{ secrets.DB_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
