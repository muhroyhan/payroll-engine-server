name: Rollback Deploy

# ─── Trigger ────────────────────────────────────────────────────────────────
# Manually triggered from the GitHub Actions UI.
# Enter the GHCR image tag you want to roll back to (from a previous release).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: |
          GHCR image tag to roll back to.
          Examples:
            sha-a1b2c3d          (immutable — from a specific commit)
            v1.2.3               (semver release tag)
            latest               (most recent master deploy)
          Find tags in: GitHub → Packages → payroll-engine-server
          Find release names in: GitHub → Releases
        required: true
        type: string

# ─── Global env ─────────────────────────────────────────────────────────────
env:
  IMAGE_NAME: ${{ github.repository }} # e.g. muhroyhan/payroll-engine-server
  FLY_APP: payroll-engine-server # must match app.name in fly.toml

# ─── Jobs ───────────────────────────────────────────────────────────────────
jobs:
  rollback:
    name: Rollback to ${{ inputs.image_tag }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # flyctl deploys the specified GHCR image tag directly to Fly.io.
      # This is effectively a rollback — no rebuild, instant activation.
      - name: Deploy rollback image to Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          args: >
            deploy
            --image ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            --app ${{ env.FLY_APP }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Write rollback summary
        run: |
          echo "## Rollback Deployed to Fly.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Rolled back to** | \`${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Full image** | \`ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **App URL** | https://${{ env.FLY_APP }}.fly.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
